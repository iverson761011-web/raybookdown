name: Recommendation public source probe
on:
  push:
    branches: ['codex/weekly-recommendations']
    paths: ['scripts/**', '.github/workflows/recommendation-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: node --test scripts/collect-recommendation-evidence.test.mjs
      - run: python3 -m pip install -r scripts/requirements-injuries.txt
      - run: python3 -m unittest discover -s scripts -p test_parse_nba_injuries.py
      - run: node scripts/collect-recommendation-evidence.mjs --probe --date=2026-11-11

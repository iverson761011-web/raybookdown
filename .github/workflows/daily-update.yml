
name: RayBookDown Daily Sync

on:
  schedule:
    - cron: '30 22 * * *'  
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'dashboard*.mjs'
      - 'data/dashboard.json'
      - 'scripts/**'
      - 'data/team.json'
      - 'scripts/check-snapshot.mjs'
      - 'scripts/check-snapshot.test.mjs'
      - '.github/workflows/daily-update.yml'
      - 'tools/windows/**'
  pull_request:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'dashboard*.mjs'
      - 'data/dashboard.json'
      - 'scripts/**'
      - 'data/team.json'
      - 'scripts/check-snapshot.mjs'
      - 'scripts/check-snapshot.test.mjs'
      - '.github/workflows/daily-update.yml'
      - 'tools/windows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate public snapshot
        run: node scripts/check-snapshot.mjs data/team.json
      - name: Test snapshot validation
        run: node --test scripts/check-snapshot.test.mjs
      - name: Validate all dashboard sections
        run: node scripts/check-dashboard.mjs data/dashboard.json
      - name: Test dashboard and NBA source validation
        run: node --test scripts/check-dashboard.test.mjs scripts/update-nba-schedule.test.mjs
      - name: Test all dashboard views and refresh behavior
        run: node scripts/check-dashboard-view.mjs
      - name: Probe public NBA source without credentials
        run: node scripts/update-nba-schedule.mjs data/dashboard.json --diagnose
      - name: Validate public-source probe output
        run: node scripts/check-dashboard.mjs data/dashboard.json
  cloud-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Test refresh-state sequencing with synthetic credentials
        shell: powershell
        run: |
          & .\tools\windows\Test-Flaim-Cloud.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\windows\Test-Flaim-Dashboard.ps1
  sync:
    needs: [check, cloud-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 15
    environment: flaim
    concurrency:
      group: raybookdown-flaim-refresh
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Refresh, persist rotating credentials, and publish sanitized roster
        shell: powershell
        env:
          FLAIM_REFRESH_TOKEN: ${{ secrets.FLAIM_REFRESH_TOKEN }}
          FLAIM_SECRET_WRITER: ${{ secrets.FLAIM_SECRET_WRITER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '& .\tools\windows\Flaim-Scheduled-Sync.ps1 -RepositoryRoot $PWD.Path'



name: RayBookDown Daily Sync

on:
  schedule:
    - cron: '30 22 * * *'  
    # Taipei 12:00-18:00: evaluate only after the target NBA date is verified final.
    - cron: '0 4-10 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'dashboard*.mjs'
      - 'features-model.mjs'
      - 'data/dashboard.json'
      - 'scripts/**'
      - 'data/team.json'
      - 'scripts/check-snapshot.mjs'
      - 'scripts/check-snapshot.test.mjs'
      - '.github/workflows/daily-update.yml'
      - 'tools/windows/**'
  pull_request:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'dashboard*.mjs'
      - 'features-model.mjs'
      - 'data/dashboard.json'
      - 'scripts/**'
      - 'data/team.json'
      - 'scripts/check-snapshot.mjs'
      - 'scripts/check-snapshot.test.mjs'
      - '.github/workflows/daily-update.yml'
      - 'tools/windows/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate public snapshot
        run: node scripts/check-snapshot.mjs data/team.json
      - name: Test snapshot validation
        run: node --test scripts/check-snapshot.test.mjs
      - name: Validate all dashboard sections
        run: node scripts/check-dashboard.mjs data/dashboard.json
      - name: Test dashboard and NBA source validation
        run: node --test scripts/check-dashboard.test.mjs scripts/update-nba-schedule.test.mjs
      - name: Test all dashboard views and refresh behavior
        run: node scripts/check-dashboard-view.mjs
      - name: Test recommendation evidence, weekly counts and history views
        run: node --test scripts/collect-recommendation-evidence.test.mjs scripts/build-weekly-schedule.test.mjs scripts/build-recommendations.test.mjs scripts/features-model.test.mjs
      - name: Test official injury parsing
        run: |
          python3 -m pip install -r scripts/requirements-injuries.txt
          python3 -m unittest discover -s scripts -p test_parse_nba_injuries.py
      - name: Probe public NBA source without credentials
        run: node scripts/update-nba-schedule.mjs data/dashboard.json --diagnose
      - name: Validate public-source probe output
        run: node scripts/check-dashboard.mjs data/dashboard.json
  cloud-tests:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Test refresh-state sequencing with synthetic credentials
        shell: powershell
        run: |
          & .\tools\windows\Test-Flaim-Cloud.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\windows\Test-Flaim-Dashboard.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\windows\Test-Flaim-History.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tools\windows\Test-Flaim-Features.ps1
  sync:
    needs: [check, cloud-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.actor != 'github-actions[bot]'))
    runs-on: windows-2022
    timeout-minutes: 25
    environment: flaim
    concurrency:
      group: raybookdown-flaim-refresh
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Collect public NBA results, performance history and injuries
        shell: powershell
        run: |
          python -m pip install -r scripts/requirements-injuries.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/collect-recommendation-evidence.mjs --dashboard=data/dashboard.json --history-days=30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify public Node runtime before loading credentials
        shell: powershell
        run: |
          . .\tools\windows\Flaim-GitHub-Common.ps1
          $parseTokens = $null; $parseErrors = $null
          $runtimeAst = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD.Path 'tools\windows\Flaim-Scheduled-Sync.ps1'),[ref]$parseTokens,[ref]$parseErrors)
          if ($parseErrors.Count) { throw 'RuntimeSyntaxFailed' }
          $nodeRuntime = Get-Command node.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1
          [pscustomobject]@{ NodeSource=$nodeRuntime.Source; NodePath=$nodeRuntime.Path; NodeExists=(Test-Path -LiteralPath $nodeRuntime.Source -PathType Leaf); CurrentDirectory=$PWD.Path } | Format-List
          & $nodeRuntime.Path --version
          if ($LASTEXITCODE -ne 0) { throw 'NativeNodeVersionCheckFailed' }
          foreach ($statement in $runtimeAst.EndBlock.Statements) {
            if ($statement -is [Management.Automation.Language.FunctionDefinitionAst] -and $statement.Name -eq 'Invoke-FlaimPublicNode') { . ([scriptblock]::Create($statement.Extent.Text)) }
          }
          Invoke-FlaimPublicNode (Join-Path $PWD.Path 'scripts\check-dashboard.mjs') (Join-Path $PWD.Path 'data\dashboard.json') 'DashboardValidationFailed'
      - name: Refresh, persist rotating credentials, and publish sanitized roster
        shell: powershell
        env:
          FLAIM_REFRESH_TOKEN: ${{ secrets.FLAIM_REFRESH_TOKEN }}
          FLAIM_SECRET_WRITER: ${{ secrets.FLAIM_SECRET_WRITER }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '& .\tools\windows\Flaim-Scheduled-Sync.ps1 -RepositoryRoot $PWD.Path'


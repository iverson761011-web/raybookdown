
name: RayBookDown Snapshot Check

on:
  schedule:
    - cron: '30 22 * * *'  
  workflow_dispatch:
  push:
    paths:
      - 'data/team.json'
      - 'scripts/check-snapshot.mjs'
      - 'scripts/check-snapshot.test.mjs'
      - '.github/workflows/daily-update.yml'
  pull_request:
    paths:
      - 'data/team.json'
      - 'scripts/check-snapshot.mjs'
      - 'scripts/check-snapshot.test.mjs'
      - '.github/workflows/daily-update.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Validate public snapshot
        run: node scripts/check-snapshot.mjs data/team.json
      - name: Test snapshot validation
        run: node --test scripts/check-snapshot.test.mjs
      - name: Report schedule status
        run: |
          TZ=Asia/Taipei date
          echo "Snapshot check completed. This workflow does not synchronize Flaim or Yahoo data."

